<body><main><h1>Кто идёт?</h1><a id="family-picker-entry" href="../../experience/guest/reels.html?mode=real&amp;lang=ru&amp;vp_release=34#family">Открыть подбор аттракционов</a></main>
<script>
(function(){
  function openPicker(){
    var target=new URL(document.getElementById('family-picker-entry').href);
    var query=new URLSearchParams(location.search);
    ['review','return','picker','utm_source','utm_medium','utm_campaign'].forEach(function(key){if(query.has(key))target.searchParams.set(key,query.get(key));});
    location.replace(target.href);
  }
  if(window.VPFamilyStorage) VPFamilyStorage.wait().then(function(ok){if(ok)openPicker();});
  else openPicker();
}());
</script></body></html>
