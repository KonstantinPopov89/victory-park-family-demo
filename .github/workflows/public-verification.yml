name: Public prototype verification
on:
  push:
    branches: [codex/verification]
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: npm install --no-save playwright
      - name: Independent public scenarios
        if: always()
        env:
          VP_QA_BASE: https://konstantinpopov89.github.io/victory-park-family-demo/
        run: node checks/independent-check.cjs --phase=core
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-independent
          path: checks/
          retention-days: 14
