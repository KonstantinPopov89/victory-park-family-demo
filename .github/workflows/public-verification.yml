name: Public prototype verification
on:
  push:
    branches: [codex/verification]
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: npm install --no-save playwright lighthouse@13.5.0
      - name: Verify published file bytes
        run: |
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          (async()=>{const expected=JSON.parse(fs.readFileSync('checks/public-allowlist.json')).allowlist,rows=[];
          for(const f of expected){let ok=false;for(let attempt=0;attempt<4;attempt++){const response=await fetch('https://konstantinpopov89.github.io/victory-park-family-demo/'+f.path,{cache:'no-store'});const body=Buffer.from(await response.arrayBuffer());const hash=crypto.createHash('sha256').update(body).digest('hex');if(response.status===200&&hash===f.sha256){rows.push({path:f.path,sha256:hash,status:response.status,bytes:body.length});ok=true;break;}await new Promise(r=>setTimeout(r,10000));}if(!ok)throw Error('Published file mismatch: '+f.path);}
          fs.writeFileSync('checks/public-readback.json',JSON.stringify({status:'PASS',files:rows},null,2));console.log('Verified all '+rows.length+' published files by SHA-256');})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Public family flow
        run: node checks/happy-path.cjs https://konstantinpopov89.github.io/victory-park-family-demo/ public
      - name: Responsive public pages
        if: always()
        run: node checks/visual-check.cjs https://konstantinpopov89.github.io/victory-park-family-demo/ public
      - name: Independent public scenarios
        if: always()
        env:
          VP_QA_BASE: https://konstantinpopov89.github.io/victory-park-family-demo/
        run: node checks/independent-check.cjs --phase=core
      - name: Cold mobile performance
        if: always()
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for page in index attractions tickets; do
            for run in 1 2 3; do
              npx lighthouse "https://konstantinpopov89.github.io/victory-park-family-demo/$page.html" --chrome-flags='--headless --no-sandbox' --only-categories=performance --output=json --output-path="checks/lighthouse-$page-$run.json" --quiet || true
            done
          done
      - name: Summarize measurements
        if: always()
        run: |
          node - <<'JS'
          const fs=require('fs'),rows=[];for(const name of ['index','attractions','tickets']){const runs=[1,2,3].map(i=>{const d=JSON.parse(fs.readFileSync(`checks/lighthouse-${name}-${i}.json`));if(d.runtimeError)throw Error(d.runtimeError.message);return {score:d.categories.performance.score,lcp:d.audits['largest-contentful-paint'].numericValue,cls:d.audits['cumulative-layout-shift'].numericValue,bytes:d.audits['total-byte-weight'].numericValue};});const median=k=>runs.map(x=>x[k]).sort((a,b)=>a-b)[1];rows.push({page:name,runs,median:{score:median('score'),lcp:median('lcp'),cls:median('cls'),bytes:median('bytes')}})}fs.writeFileSync('checks/performance-summary.json',JSON.stringify(rows,null,2));console.log(JSON.stringify(rows));
          JS
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-repaired
          path: checks/
          retention-days: 14
